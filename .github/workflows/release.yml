name: release

# `./dev.sh release vX.Y.Z` pushes a tag -> build the portable app on every OS,
# then publish a GitHub Release with the CHANGELOG section as its notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:           # try the builds without releasing (artifacts only)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest,   name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: ubuntu-22.04,   name: linux-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libxcb-cursor0
      - name: Build (includes a selftest of the built app)
        run: ./dev.sh build
        env: { PYTHON: python }
      - name: MSI installer (built, then installed/upgraded/uninstalled in both modes as a test)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_type }}" -eq "tag" ? "${{ github.ref_name }}" : ""
          ./packaging/windows/build_msi.ps1 -Version $v -Test
          Move-Item BlamixFiles-*-x64.msi dist/
      # one download per file in the run's Artifacts list (no zip around them)
      - name: Upload the portable app
        uses: actions/upload-artifact@v7
        with:
          path: dist/BlamixFiles-${{ matrix.name }}.*
          archive: false
          if-no-files-found: error
      - name: Upload the MSI installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: dist/BlamixFiles-*-x64.msi
          archive: false
          if-no-files-found: error
      # everything together, for the release job below
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}
          path: |
            dist/BlamixFiles-*.zip
            dist/BlamixFiles-*.msi
            dist/BlamixFiles-*.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## " v "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| Windows installer | \`BlamixFiles-$v-x64.msi\` (all users or just you) |"
            echo "| Windows portable | \`BlamixFiles-windows-x64.zip\` (unzip anywhere, run BlamixFiles.exe) |"
            echo "| macOS Apple Silicon / Intel | \`BlamixFiles-macos-arm64.zip\` / \`BlamixFiles-macos-x64.zip\` |"
            echo "| Linux | \`BlamixFiles-linux-x64.tar.gz\` |"
            echo
            echo "Portable: your sites stay in the \`data\` folder next to the app. The apps aren't code-signed yet:"
            echo "Windows SmartScreen → *More info → Run anyway*; macOS → right-click → *Open* the first time."
          } >> notes.md
          cat notes.md
      - uses: actions/download-artifact@v8
        with: { path: out, pattern: "bundle-*", merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          body_path: notes.md
