[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blamixfiles"
dynamic = ["version"]
description = "Open-source FileZilla alternative: SFTP, SCP, FTP/FTPS, S3 and WebDAV with folder sync, a built-in editor and an encrypted vault."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "paramiko>=3.4",
  "httpx>=0.27",
  "boto3>=1.34",
  'cryptography>=42,<49; sys_platform == "darwin" and platform_machine == "x86_64"',
  'cryptography>=42; sys_platform != "darwin" or platform_machine != "x86_64"',
]

[project.optional-dependencies]
gui = ["PySide6>=6.7", "Pygments>=2.17"]
tui = ["textual>=0.80"]
all = ["PySide6>=6.7", "Pygments>=2.17", "textual>=0.80"]

[project.scripts]
blamixfiles = "blamixfiles.cli:main"

[project.gui-scripts]
blamixfiles-gui = "blamixfiles.main:main"

[tool.setuptools.dynamic]
version = { attr = "blamixfiles.__version__" }

[tool.setuptools.packages.find]
include = ["blamixfiles*"]

[tool.setuptools.package-data]
blamixfiles = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:pyftpdlib.*",     # the FTP test server, not our code
  "ignore::DeprecationWarning:asynchat",
  "ignore::DeprecationWarning:asyncore",
  # a test server's socket is closed during teardown before its buffer is flushed (Windows)
  "ignore:Exception ignored in. <function IOBase.__del__:pytest.PytestUnraisableExceptionWarning",
]
